[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vllm-hust-utility-victim"
dynamic = ["version"]
description = "Default-off extraction of Ascend PR 39 utility victim selection"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "build>=1", "ruff>=0.12"]

[project.entry-points."vllm.general_plugins"]
utility_victim = "vllm_hust_utility_victim.plugin:register"

[project.entry-points."vllm_hust.extension_bundles"]
"org.vllm-hust.utility-victim" = "vllm_hust_utility_victim.manifests"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "vllm_hust_utility_victim._version.__version__"}

[tool.setuptools.package-data]
vllm_hust_utility_victim = ["manifests/*.json", "host_fingerprints.json", "core_contract.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
